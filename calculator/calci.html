<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Basics Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<DIV class="main-box">
    <div class="h1">
    <span class="t1">amazon basics</span> 
    <span class="t2">112 STEPS CHECK & CORRECT </span>
  </div>

  <DIV class="display">
    <div class="h2">
        <span>01</span>
    </div>
    <input type="text" class="textbox" value="123456789012" readonly>
   </DIV>
   
<div class="h3">
    <span>12-DIGIT</span> 
    <span>555 </span>
     <span>POWER</span>
</div>

<div class="line1">
    <button class="blue-1">CHECK <br><b><-- </b></button> 
    <button class="blue-1">CHECK <br><b>--></b></button> 
    <button class="black-1 ">CORRECT</button>
    <button class="black-1" >AUTO <br>REPLAY</button> 
     <div class="solar-cell-box"></div>
  </div>

  <div class="keypad-main">
    
    <button >RATE</button>
     <button class="num">7</button>
  <button class="num">8</button>
      <button class="num">9</button>
    <button class="sign">√</button>
     <button class="sign">%</button>
     <button class="orange-btn">ON/C</button>

     <button class="fun">-GST <br><small>REC</small></button>
         <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
         <button class="sign">×</button>
      <button class="sign">÷</button>
            <button class="fun">MRC</button>

<button class="fun">+GST <br><small>SET</small></button>
            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
            <button class="sign-plus" style="grid-row: span 2;">+</button>
            <button class="sign">-</button>
            <button class="fun">M+</button>

            
            <button class="fun">MU</button>
            <button class="num">0</button>
            <button class="num">00</button>
            <button class="num">.</button>
            
            <button class="sign">=</button>
            <button class="fun">M-</button>
        </div>

</DIV>
</body>
</html>
